<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>English Fun Zone – Year 2</title>
<style>
/* ============ STYLE : "exercise book" look ============ */
:root{
  --paper:#f7f0e1; --paper2:#fffdf6; --ink:#1d2a44; --soft:#66708a;
  --tomato:#ec5b3b; --mustard:#f5b83d; --teal:#1f9d8f; --plum:#6d4aa3; --sky:#8cc8ea;
  --good:#1b8a4f; --good-bg:#d8f3e2; --bad:#c93a3a; --bad-bg:#ffe0dc;
  --sun:#f5b83d; --sun-d:#d99a14; --coral:#ec5b3b; --mint:#1f9d8f; --purple:#6d4aa3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Andika","Atkinson Hyperlegible","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(rgba(29,42,68,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,42,68,.07) 1px,transparent 1px);
  background-size:26px 26px;min-height:100vh;font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:8px 14px 120px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
img{max-width:100%;height:auto}
h1{font-family:"Caveat Brush","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:400;font-size:3.4rem;margin:0;line-height:.95;letter-spacing:.5px}
.muted{color:var(--soft);font-weight:700;font-size:.9rem}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:2.5px solid var(--ink);margin:0 -14px;padding:8px 14px 10px}
.trow{display:flex;align-items:center;gap:8px}
.chip{border:2.5px solid var(--ink);border-radius:8px;background:var(--paper2);padding:0 12px;font-weight:700;box-shadow:3px 3px 0 var(--ink);min-height:40px}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sun{background:var(--mustard)}
.tl{flex:1;font-weight:700;text-align:center;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:var(--paper2);border:2.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--teal) 0 8px,#2cb7a8 8px 16px);transition:width .3s}

/* cards */
.card{background:var(--paper2);border:2.5px solid var(--ink);border-radius:10px;padding:14px;margin:14px 0;box-shadow:5px 5px 0 var(--ink)}
.goal{border:2.5px solid var(--ink);border-radius:10px;padding:8px 14px;margin:14px 0 8px;font-weight:700;font-size:1.1rem;box-shadow:4px 4px 0 var(--ink);transform:rotate(-.6deg)}
.goal small{display:block;font-weight:500;font-size:.85rem;opacity:.85}
.qtext{font-size:1.35rem;font-weight:700;margin:6px 0}
.bigemoji{font-size:5rem;text-align:center;line-height:1.1}
.bigemoji svg{width:120px;height:120px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.speak{border:2.5px solid var(--ink);border-radius:8px;background:var(--sky);padding:2px 12px;font-weight:700;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.speak:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* coach */
.coach{display:flex;gap:10px;align-items:center;margin:10px 0;min-height:52px}
.coach .owl{font-size:2.2rem;transform:rotate(-20deg);display:inline-block}
.bubble{flex:1;border:2.5px solid var(--ink);border-radius:4px 14px 14px 14px;padding:6px 12px;font-weight:700;background:var(--paper2)}
.bubble.ok{background:var(--good-bg);border-color:var(--good)}
.bubble.no{background:var(--bad-bg);border-color:var(--bad)}
.bubble.info{background:#fff1c4}

/* hub */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.acard{border:2.5px solid var(--ink);border-radius:12px 12px 12px 4px;padding:14px 10px 12px;text-align:center;box-shadow:5px 5px 0 var(--ink);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.acard:nth-child(odd){transform:rotate(-.8deg)}.acard:nth-child(even){transform:rotate(.8deg)}
.acard:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.acard .num{position:absolute;top:-12px;left:10px;background:var(--ink);color:var(--paper2);border-radius:4px;padding:0 8px;font-size:.78rem;font-weight:700}
.acard .em{font-size:2.5rem;line-height:1.1}
.acard b{font-size:1.1rem;line-height:1.1}
.acard span{font-size:.85rem;font-weight:700}
.acard .st{background:var(--paper2);border:2px solid var(--ink);border-radius:4px;padding:0 10px;font-weight:700;margin-top:4px}

/* options */
.opts{display:grid;gap:12px;margin-top:12px}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opt{border:2.5px solid var(--ink);border-radius:10px;background:var(--paper2);padding:8px;font-weight:700;font-size:1.1rem;min-height:60px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt .e{font-size:3rem;line-height:1.1}
.opt .e svg{width:60px;height:60px}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt.good{background:var(--good-bg);border-color:var(--good);box-shadow:4px 4px 0 var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s;box-shadow:4px 4px 0 var(--bad);opacity:.8}
.opt[disabled]{cursor:default}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.learn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff1c4;border:2.5px solid var(--ink);border-radius:10px;padding:6px 12px;margin-top:14px;font-weight:700;font-size:1.15rem}
.learn .le{font-size:2.2rem;line-height:1}
.learn .le svg{width:44px;height:44px}
.how{background:#fff1c4;border:2.5px dashed var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;line-height:1.45;margin:14px 0}
.how small{display:block;color:var(--soft);font-weight:600;margin-top:4px}

/* words / sentence builder */
.word{border:2.5px solid var(--ink);border-radius:8px;background:var(--teal);color:#fff;font-weight:700;font-size:1.2rem;padding:2px 14px;min-height:46px;box-shadow:3px 3px 0 var(--ink)}
.word:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* sort */
.profiles{display:grid;gap:10px;margin:10px 0}
.prof{border:2.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:1rem;background:var(--paper2)}
.prof b{font-size:1.1rem}
.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.flag{border:2.5px solid var(--ink);border-radius:10px;background:var(--paper2);padding:8px 2px;font-weight:700;box-shadow:4px 4px 0 var(--ink);font-size:1rem;display:flex;flex-direction:column;align-items:center}
.flag .e{font-size:2.2rem;line-height:1.1}
.flag.good{background:var(--good-bg);border-color:var(--good)}
.flag.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}

/* spell */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.sl{width:52px;height:60px;border:2.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:1.9rem;font-weight:700;background:var(--paper2)}
.sl.first{background:var(--sky)}
.sl.good{background:var(--good-bg);border-color:var(--good)}
.sl.rev{background:#ffe9c9}
.sl.bad{background:var(--bad-bg);animation:shake .35s}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.ltile{width:56px;height:56px;border:2.5px solid var(--ink);border-radius:10px;background:var(--mustard);font-weight:700;font-size:1.7rem;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.ltile:nth-child(even){transform:rotate(2deg)}
.ltile.used{opacity:.2;cursor:default}
.ltile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* count */
.objs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.obj{position:relative;width:64px;height:64px;border:2.5px solid transparent;border-radius:10px;background:#f1ece0;font-size:2.4rem;padding:0;line-height:1}
.obj.on{background:var(--mustard);border-color:var(--ink)}
.obj i{position:absolute;right:-4px;top:-8px;background:var(--plum);color:#fff;border-radius:50%;width:26px;height:26px;font-size:.95rem;font-style:normal;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.count-say{text-align:center;font-size:1.3rem;font-weight:700}
.count-say b{font-size:2.6rem;color:var(--plum)}

/* sentence builder */
.line{min-height:64px;border:2.5px dashed var(--ink);border-radius:10px;background:var(--paper2);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.line .ph{color:var(--soft);font-weight:700}
.line .dot{font-size:1.6rem;font-weight:700}
.line.good{border-color:var(--good);background:var(--good-bg);border-style:solid}
.line.bad{animation:shake .35s;border-color:var(--bad)}
.wbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.hint{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:6px;background:var(--paper2);padding:0 12px;font-weight:700}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.stage{text-align:center;background:#fff4dc;border:2.5px solid var(--ink);border-radius:10px;padding:10px}
.stage .who{font-size:4.2rem;line-height:1}
.stage svg{width:130px;height:130px}

/* week */
.days{display:grid;gap:8px;margin:8px 0}
.day{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper2);padding:4px 10px;text-align:left;min-height:54px;font-weight:700}
.day.sel{background:var(--mustard);box-shadow:3px 3px 0 var(--ink)}
.day .de{font-size:1.8rem;width:40px;text-align:center}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.pal button{border:2.5px solid var(--ink);border-radius:8px;background:var(--paper2);padding:4px 0;font-size:.72rem;font-weight:700;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:74px;justify-content:center}
.pal button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pal button .e{font-size:1.9rem}
.mine{background:repeating-linear-gradient(transparent 0 31px,rgba(29,42,68,.18) 31px 32px),#fffdf6;border:2.5px solid var(--ink);border-radius:10px;padding:2px 14px;font-size:1.1rem;line-height:32px}

/* bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2.5px solid var(--ink);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{border:2.5px solid var(--ink);border-radius:10px;padding:8px 16px;font-weight:700;font-size:1.05rem;box-shadow:4px 4px 0 var(--ink);background:var(--paper2);min-height:52px;white-space:nowrap}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--tomato);color:#fff;flex:1.4}
.btn.mint{background:var(--teal);color:#fff}
.btn.big{width:100%;font-size:1.3rem}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink)}
.btn.sm{min-height:42px;padding:2px 14px;font-size:1rem;box-shadow:3px 3px 0 var(--ink)}
.name-in{width:100%;border:2.5px solid var(--ink);border-radius:8px;padding:10px 12px;font-size:1.25rem;font-family:inherit;margin:8px 0 6px;background:#fff;color:var(--ink)}
.name-in:focus{outline:3px solid var(--sky);outline-offset:1px}
.lab{font-weight:700;font-size:1.1rem}
.req{color:var(--tomato)}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin:2px 0 10px}
.savednote{margin-top:14px;font-weight:700;font-size:.95rem;color:var(--soft)}
.savednote small{display:block;font-weight:600}
.warn{background:#fff1c4;border:2.5px dashed var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.95rem;margin:14px 0}
.score{text-align:center}
.score .big{font-family:"Caveat Brush","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:4rem;color:var(--tomato);line-height:1}
.pbar{display:grid;grid-template-columns:38px 1fr 54px;gap:8px;align-items:center;margin:8px 0;font-weight:700}
.pbar .t{height:18px;background:var(--paper2);border:2.5px solid var(--ink);border-radius:4px;overflow:hidden}
.pbar .t i{display:block;height:100%;background:var(--teal)}
.pr{border:2.5px solid var(--ink);border-radius:8px;padding:6px 10px;margin:8px 0;background:var(--paper2);font-size:1rem}
.pr b{color:var(--plum)}
.pr svg{width:40px;height:40px}
.pr .a{color:var(--good);font-weight:700}

/* home */
.hero{position:relative;text-align:left;padding:22px 18px 18px;background:var(--mustard);margin-top:22px}
.hero .tag{margin:10px 0 0;font-weight:700}
.hero .sticker{position:absolute;right:14px;top:-16px;background:var(--tomato);color:#fff;border:2.5px solid var(--ink);border-radius:50%;width:78px;height:78px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:1.05rem;line-height:1.05;transform:rotate(10deg);box-shadow:3px 3px 0 var(--ink)}
.hero svg{position:absolute;right:10px;bottom:6px;width:120px;height:60px}

/* effects */
.confetti{position:fixed;left:0;right:0;top:0;height:0;z-index:60;pointer-events:none}
.confetti span{position:absolute;top:-30px;width:9px;height:15px;border:1.5px solid var(--ink);animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:6px;font-weight:700;z-index:70}
@media(max-width:420px){body{font-size:17px}h1{font-size:3rem}.sl{width:44px;height:54px}.obj{width:56px;height:56px;font-size:2.1rem}.btn{padding:8px 12px;font-size:1rem}.opt .e{font-size:2.5rem}}
</style>
</head>

<script id="engine">
"use strict";
const PRAISE=["Great job!","Super!","Well done!","You got it!","Wow, nice!","Yes! Correct!"];
const state={done:{},saved:{},submitted:false,screen:"home",name:"",actId:0,i:0,res:{},cur:null,snd:true,week:[],weekDone:false,sel:0,showReport:false};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function act(id){return ACTS.filter(function(a){return a.id===id;})[0];}
function A(){return act(state.actId);}
function nItems(a){return a.type==="week"?1:a.items.length;}
function starsOf(id){var r=state.res[id]||[];return r.filter(function(x){return x&&x.r==="first";}).length;}
function totalStars(){var s=0;ACTS.forEach(function(a){if(a.type!=="week")s+=starsOf(a.id);});return s;}
function maxStars(){var s=0;ACTS.forEach(function(a){if(a.type!=="week")s+=nItems(a);});return s;}

/* ---------- bunyi & kesan ---------- */
var AC=null;
function tone(f,t,d,v){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(v||0.12,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+t+d);
    o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+0.02);
  }catch(e){}
}
function sfx(k){if(!state.snd)return; if(k==="ok"){tone(660,0,.12);tone(880,.1,.12);tone(1100,.2,.18);} else if(k==="no"){tone(220,0,.18,.1);tone(180,.14,.22,.1);} else if(k==="done"){tone(523,0,.12);tone(659,.12,.12);tone(784,.24,.12);tone(1047,.36,.3);}}
function confetti(n){
  var c=document.createElement("div");c.className="confetti";var col=["#ec5b3b","#f5b83d","#1f9d8f","#6d4aa3","#8cc8ea"];
  for(var i=0;i<(n||14);i++){var s=document.createElement("span");s.style.background=rnd(col);s.style.left=(Math.random()*95)+"%";s.style.animationDelay=(Math.random()*.3)+"s";c.appendChild(s);}
  document.body.appendChild(c);setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},1800);
}
function speak(text,quiet){
  if(!("speechSynthesis" in window)){if(!quiet)toast("No sound on this device.");return;}
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(text).replace(/_+/g," blank "));u.lang="en-GB";u.rate=.85;window.speechSynthesis.speak(u);}catch(e){}
}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2200);}
function spk(text){return '<button class="speak" data-do="speak" data-text="'+esc(text)+'" aria-label="Listen">🔊 Listen</button>';}

/* ---------- pakaian (SVG) ---------- */
function cloth(kind,fill){
  var P={
    tshirt:'<path d="M30 18 L8 36 L20 52 L30 45 L30 88 L70 88 L70 45 L80 52 L92 36 L70 18 Q50 32 30 18Z"/>',
    jacket:'<path d="M34 12 L6 40 L14 86 L28 84 L30 50 L30 90 L70 90 L70 50 L72 84 L86 86 L94 40 L66 12 L50 26Z"/><path d="M50 26 V90" fill="none"/>',
    skirt:'<path d="M34 20 H66 L90 84 H10 Z"/><rect x="34" y="14" width="32" height="9" rx="3"/>',
    trousers:'<path d="M28 12 H72 L78 90 H55 L50 44 L45 90 H22 Z"/>',
    dress:'<path d="M40 8 L46 8 Q50 20 54 8 L60 8 L64 36 L90 88 H10 L36 36 Z"/>',
    hat:'<path d="M6 64 Q50 84 94 64 Q86 58 72 56 Q72 18 50 18 Q28 18 28 56 Q14 58 6 64Z"/><path d="M29 54 Q50 62 71 54" fill="none"/>'
  };
  return '<svg viewBox="0 0 100 100" role="img" aria-label="clothes" fill="'+fill+'" stroke="#26324d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">'+P[kind]+'</svg>';
}

/* ---------- data pembantu ---------- */
function itemMeta(a,i){
  var it=a.items?a.items[i]:null;
  if(a.type==="pick") return {q:it.q,a:it.opts[it.a].t};
  if(a.type==="sort") return {q:it.q,a:COUNTRIES[it.a].name};
  if(a.type==="spell") return {q:"Spell: "+it.bm,a:it.w};
  if(a.type==="count") return {q:"Count the "+it.noun,a:sentenceOf(a,i)};
  if(a.type==="dress") return {q:it.name+": "+it.color+" "+it.noun,a:sentenceOf(a,i)};
  return {q:"",a:""};
}
function wordsOf(a,i){
  var it=a.items[i];
  if(a.type==="count") return ["There","are",NUMW[it.n],it.noun];
  if(a.type==="dress"){return it.art?[it.pr,"is","wearing","a",it.color,it.noun]:[it.pr,"is","wearing",it.color,it.noun];}
  return [];
}
function sentenceOf(a,i){return wordsOf(a,i).join(" ")+".";}
function extrasOf(a,i){
  var it=a.items[i];
  if(a.type==="count"){var o=[NUMW[it.n+1]||NUMW[it.n-1],"is"];return o;}
  if(a.type==="dress"){return [it.pr==="He"?"She":"He", it.art?"are":"a"];}
  return [];
}

/* ---------- setup ---------- */
function setupItem(){
  var a=A(), i=state.i;
  var c={tries:0,solved:false,msg:"",kind:"",wrong:[]};
  if(a.type==="spell"){
    var w=a.items[i].w, rest=w.slice(1).split("").map(function(ch,k){return {id:k,ch:ch};}), t, g=0;
    do{t=shuffle(rest);g++;}while(t.map(function(x){return x.ch;}).join("")===w.slice(1)&&g<20&&w.length>2);
    c.tiles=t;c.picked=[];
  }
  if(a.type==="count"){c.order=[];c.ans=[];c.bank=shuffle(wordsOf(a,i).concat(extrasOf(a,i)));}
  if(a.type==="dress"){c.ans=[];c.bank=shuffle(wordsOf(a,i).concat(extrasOf(a,i)));}
  state.cur=c;
}
function sendRecord(rec){
  if(!SHEET_URL||!state.name)return;
  try{rec.name=state.name;rec.time=new Date().toISOString();
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec),keepalive:true}).catch(function(){});}catch(e){}
}
function reportRecord(){
  var names=[],scores=[],maxes=[],items=[];
  ACTS.forEach(function(a){
    if(a.type==="week")return;
    var played=(state.res[a.id]||[]).filter(Boolean).length;
    names.push(a.name);scores.push(played?starsOf(a.id):"");maxes.push(nItems(a));
    (state.res[a.id]||[]).forEach(function(x){if(x&&x.r!=="first")items.push(x.q+" → "+x.a);});
  });
  var t=totalStars(),m=maxStars();
  return {total:t,max:m,pct:Math.round(t/m*100),names:names,scores:scores,maxes:maxes,
    myWeek:state.weekDone?"Done":"",practise:items.join(" | "),weekText:state.weekDone?weekText():""};
}
function sayIf(t){if(state.snd)speak(t,true);}
function pKey(){return "efz_"+state.name.toLowerCase();}
function persist(){
  if(!state.name)return;
  try{localStorage.setItem(pKey(),JSON.stringify({res:state.res,done:state.done,saved:state.saved,week:state.week,weekDone:state.weekDone,submitted:state.submitted,sel:state.sel}));}catch(e){}
}
function restore(){
  state.res={};state.done={};state.saved={};state.week=[];state.weekDone=false;state.submitted=false;state.sel=0;
  try{var j=JSON.parse(localStorage.getItem(pKey())||"null");
    if(j){state.res=j.res||{};state.done=j.done||{};state.saved=j.saved||{};state.week=j.week||[];state.weekDone=!!j.weekDone;state.submitted=!!j.submitted;state.sel=j.sel||0;}}catch(e){}
}
/* A finished activity cannot be replayed: it opens in review mode and the first attempt keeps the marks. */
function startAct(id){
  state.lastRead="";state.actId=id;
  if(state.done[id]){state.screen="review";render();return;}
  state.screen="act";
  if(act(id).type==="week"){state.cur={};}
  else if(state.saved[id]){state.i=state.saved[id].i;state.cur=state.saved[id].cur;}
  else{state.i=0;state.res[id]=[];setupItem();}
  render();
}
function record(r,idx){
  var a=A(), m=itemMeta(a,idx===undefined?state.i:idx), k=idx===undefined?state.i:idx;
  state.res[a.id][k]={r:r,q:m.q,a:m.a};
}
function good(idx){
  var c=state.cur; var first=(idx===undefined?c.tries:c.bt[idx])===0;
  record(first?"first":"second",idx);
  c.msg=rnd(PRAISE)+(first?"":" (2nd try)");c.kind="ok";
  sfx("ok");confetti(first?16:8);
}
function bad(correctText,idx){
  var c=state.cur;
  if(idx===undefined){c.tries++;} else {c.bt[idx]++;}
  var t=idx===undefined?c.tries:c.bt[idx];
  if(t>=2){record("reveal",idx);c.msg="The answer is: "+correctText;c.kind="info";sfx("no");return true;}
  c.msg="Not quite. Try again!";c.kind="no";sfx("no");return false;
}

/* ---------- paparan ---------- */
function coach(){var c=state.cur;if(!c||!c.msg)return '<div class="coach"><span class="owl">✏️</span><div class="bubble info">Let\'s go!</div></div>';return '<div class="coach"><span class="owl">✏️</span><div class="bubble '+c.kind+'">'+esc(c.msg)+'</div></div>';}
function goalHtml(a){return '<div class="goal" style="background:'+a.color+'">'+esc(a.goal)+'<small>'+esc(a.ms)+'</small></div>';}
function topbar(){
  var a=A(), n=nItems(a), label=a.type==="week"?"5 days":(state.i+1)+" of "+n;
  var done=state.i+(state.cur&&state.cur.solved?1:0);
  var pct=a.type==="week"?(state.week.filter(Boolean).length*20):Math.round(done/n*100);
  return '<div class="topbar"><div class="trow"><button class="chip" data-do="hub" aria-label="Back to activities">🏠</button><div class="tl">'+esc(a.em+" "+a.name)+' · '+label+'</div><button class="chip" data-do="snd" aria-label="Sound">'+(state.snd?"🔊":"🔇")+'</button></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function pickHtml(a,it){
  var c=state.cur, allE=it.opts.every(function(o){return o.e;});

    var cls="opt"+(c.wrong.indexOf(k)>=0?" bad":"")+((c.solved&&k===it.a)?" good":"");
    h+='<button class="'+cls+'" data-do="pick" data-k="'+k+'" aria-label="'+esc(o.t)+'"'+((c.solved||c.wrong.indexOf(k)>=0)?" disabled":"")+'>'+(o.e?'<span class="e">'+o.e+'</span>':'')+(o.hide?'':'<span>'+esc(o.t)+'</span>')+'</button>';

  var c=state.cur, h='<div class="profiles">';
  a.profiles.forEach(function(p){h+='<div class="prof"><b>'+COUNTRIES[p.k].e+' '+COUNTRIES[p.k].name+'</b><br>'+esc(p.text)+'</div>';});

function spellHtml(a,it){
  var c=state.cur, w=it.w, st=c.solved?(state.res[a.id][state.i].r==="reveal"?"rev":"good"):"";
  var h='<div class="card" style="text-align:center">'+(it.svg?'<div class="bigemoji">'+it.svg+'</div>':it.img?'<img src="'+IMG[it.img]+'" alt="body part" style="max-height:170px;border:3px solid #26324d;border-radius:14px">':'<div class="bigemoji">'+it.e+'</div>')+
    '<div class="muted">'+esc(it.bm)+'</div><div class="slots">';
  for(var k=0;k<w.length;k++){

function lineHtml(){

  h+='</div><div class="row" style="justify-content:center"><button class="btn sm" data-do="wclear"'+(c.solved?" disabled":"")+'>↺ Clear</button><button class="btn sm mint" data-do="wcheck"'+((c.solved||!c.ans.length)?" disabled":"")+'>Check ✔</button></div>';

function autoRead(){

    if(state.screen!=="act")return;
    var a=A(),c=state.cur; if(!c||a.type==="week")return;

    if(c.solved){ if(a.type==="spell"){key+=":s";say=it.w;} else if(it.learn){key+=":s";say=it.learn.w;} else return; }
    else{
      key+=":q";

      else if(a.type==="spell") say=it.w;

      else if(a.type==="dress") say="This is "+it.name+". What is "+(it.pr==="He"?"he":"she")+" wearing?";

function copyText(txt){

  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(function(){return true;},function(){return fb();});

}

document.addEventListener("click",function(e){

  var d=t.getAttribute("data-do"), a=state.actId?A():null, c=state.cur, it=(a&&a.items)?a.items[state.i]:null;

  }

    if(k3===it.a){good();c.solved=true;}
    else{c.wrong.push(k3);var rev3=bad(COUNTRIES[it.a].name);if(rev3)c.solved=true;}
    render(true);return;}
  /* ---- spell ---- */
  if(d==="ltile"&&!c.solved){

    if(c.picked.length===it.w.length-1){
      var got=it.w[0]+c.picked.map(function(k4){return c.tiles[k4].ch;}).join("");
      if(got===it.w){c.solved=true;good();}
      else{var rev4=bad(it.w);if(rev4){c.solved=true;}else{c.picked=[];c.badSlots=true;}}
    }

  if(d==="lback"){c.picked.pop();render(true);return;}
  if(d==="lclear"){c.picked=[];render(true);return;}
  /* ---- count ---- */
  if(d==="obj"){var k5=+t.getAttribute("data-k");if(c.order.indexOf(k5)<0){c.order.push(k5);render(true);}return;}
  if(d==="oreset"){c.order=[];render(true);return;}
  /* ---- sentence tiles (count + dress) ---- */
  if(d==="wtile"&&!c.solved){sayIf(t.getAttribute("data-w"));c.ans.push(t.getAttribute("data-w"));render(true);return;}
  if(d==="wun"&&!c.solved){var w2=t.getAttribute("data-w");c.ans=c.ans.filter(function(x){return x!==w2;});render(true);return;}
  if(d==="wclear"&&!c.solved){c.ans=[];render(true);return;}
  if(d==="wcheck"&&!c.solved){finishWords(a,c.ans.join(" ")===wordsOf(a,state.i).join(" "));render(true);return;}

  if(d==="wk"){state.week[state.sel]=WEEK_CHOICES[+t.getAttribute("data-k")];sfx("ok");
    var nx=-1;for(var q=1;q<=5;q++){var kk=(state.sel+q)%5;if(!state.week[kk]){nx=kk;break;}}
